[project]
name = "nnmodelling-vae-consumer"
version = "0.1.0"
description = "Standalone inference demo for the trained MNIST VAE model wheel"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "nnm-mnist-vae==0.1.0",
    "pillow",
    "torch==2.14.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
nnm-mnist-vae = { path = "wheels/nnm_mnist_vae-0.1.0-py3-none-any.whl" }
torch = { index = "pytorch-cpu" }

[tool.uv.workspace]
members = []
