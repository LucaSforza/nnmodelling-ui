[project]
name = "nnmodelling-llm-consumer"
version = "0.1.0"
description = "Standalone inference demo for the completed Tiny Shakespeare model wheel"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch==2.14.1",
    "nnmodel-a64143c8-07c2-40e7-8f89-37c33d64970b==0.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
nnmodel-a64143c8-07c2-40e7-8f89-37c33d64970b = { path = "wheels/nnmodel_a64143c8_07c2_40e7_8f89_37c33d64970b-0.1.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = []
