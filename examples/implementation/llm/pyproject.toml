[project]
name = "nnmodelling-llm-consumer"
version = "0.1.0"
description = "Standalone Tiny Shakespeare inference demo using a replaceable model wheel"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch==2.14.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = []
