[project]
name = "nnmodelling-runtime"
version = "0.1.0"
description = "Python execution runtime and dataset SDK for NNModelling"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "safetensors>=0.4", "numpy>=1.26"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nnmodelling_runtime", "src/stereotype_runtime"]
